<!DOCTYPE html>
<html>
<head>
    <title>Tapo P110 Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Tapo P110 Control</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, '1')">
                <span class="tab-name" id="tabName1">Plug 1</span>
                <span class="edit-icon" onclick="event.stopPropagation(); editPlugName('1')">✏️</span>
            </button>
            <button class="tab" onclick="switchTab(event, '2')">
                <span class="tab-name" id="tabName2">Plug 2</span>
                <span class="edit-icon" onclick="event.stopPropagation(); editPlugName('2')">✏️</span>
            </button>
        </div>
        
        <div class="clocks">
            <div class="clock-card">
                <div class="clock-label">Local Time</div>
                <div class="clock-time" id="localTime">--:--:--</div>
            </div>
            <div class="clock-card">
                <div class="clock-label">Berlin Time</div>
                <div class="clock-time" id="berlinTime">--:--:--</div>
            </div>
            <div class="clock-card">
                <div class="clock-label">UTC Time</div>
                <div class="clock-time" id="utcTime">--:--:--</div>
            </div>
        </div>
        
        <div id="plug1" class="plug-content active">
            <div id="status1" class="status">Loading...</div>
            
            <div class="controls">
                <button class="btn-on" onclick="turnOn('1')">Turn On</button>
                <button class="btn-off" onclick="turnOff('1')">Turn Off</button>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Current Power</div>
                    <div class="stat-value" id="currentPower1">-- W</div>
                    <div class="stat-timestamp" id="powerTimestamp1">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Today's Usage</div>
                    <div class="stat-value" id="dayEnergy1">-- Wh</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">This Month</div>
                    <div class="stat-value" id="monthEnergy1">-- Wh</div>
                </div>
            </div>
            
            <div class="schedules">
                <h2>Schedules (UTC Time)</h2>
                <div class="schedule-form">
                    <select id="action1">
                        <option value="on">Turn On</option>
                        <option value="off">Turn Off</option>
                    </select>
                    <input type="number" id="hour1" min="0" max="23" placeholder="Hour (0-23)">
                    <input type="number" id="minute1" min="0" max="59" placeholder="Minute (0-59)">
                    <button class="btn-add" onclick="addSchedule('1')">Add Schedule</button>
                </div>
                <div class="schedule-list" id="scheduleList1"></div>
            </div>
            
            <div class="log">
                <h2>Activity Log</h2>
                <div class="log-controls">
                    <div class="log-filter">
                        <input type="checkbox" id="hideAutomatic1" onchange="displayLogs('1')">
                        <label for="hideAutomatic1">Hide automatic actions</label>
                    </div>
                    <button class="btn-clear-log" onclick="clearLog('1')">Clear Log</button>
                </div>
                <div class="log-list" id="logList1"></div>
            </div>
        </div>

        <div id="plug2" class="plug-content">
            <div id="status2" class="status">Loading...</div>
            
            <div class="controls">
                <button class="btn-on" onclick="turnOn('2')">Turn On</button>
                <button class="btn-off" onclick="turnOff('2')">Turn Off</button>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Current Power</div>
                    <div class="stat-value" id="currentPower2">-- W</div>
                    <div class="stat-timestamp" id="powerTimestamp2">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Today's Usage</div>
                    <div class="stat-value" id="dayEnergy2">-- Wh</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">This Month</div>
                    <div class="stat-value" id="monthEnergy2">-- Wh</div>
                </div>
            </div>
            
            <div class="schedules">
                <h2>Schedules (UTC Time)</h2>
                <div class="schedule-form">
                    <select id="action2">
                        <option value="on">Turn On</option>
                        <option value="off">Turn Off</option>
                    </select>
                    <input type="number" id="hour2" min="0" max="23" placeholder="Hour (0-23)">
                    <input type="number" id="minute2" min="0" max="59" placeholder="Minute (0-59)">
                    <button class="btn-add" onclick="addSchedule('2')">Add Schedule</button>
                </div>
                <div class="schedule-list" id="scheduleList2"></div>
            </div>
            
            <div class="log">
                <h2>Activity Log</h2>
                <div class="log-controls">
                    <div class="log-filter">
                        <input type="checkbox" id="hideAutomatic2" onchange="displayLogs('2')">
                        <label for="hideAutomatic2">Hide automatic actions</label>
                    </div>
                    <button class="btn-clear-log" onclick="clearLog('2')">Clear Log</button>
                </div>
                <div class="log-list" id="logList2"></div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
